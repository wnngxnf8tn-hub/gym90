<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impressum - Autoaufbereitung Stoll</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
          Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
        color: #f2f5fb;
        background-color: #0b0f1a;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at top, rgba(21, 74, 154, 0.35), transparent 55%),
          #0b0f1a;
      }
      a {
        color: #7fb2ff;
        text-decoration: none;
      }
      main {
        max-width: 900px;
        margin: 48px auto;
        padding: 0 20px;
        text-align: center;
      }
      h1 {
        margin: 0 0 16px;
      }
      p {
        margin: 0 0 16px;
        color: #c8d3e7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Impressum</h1>
      <p>Platzhaltertext. Bitte hier Ihre Angaben eintragen.</p>
      <p><a href="/">Zurück zur Startseite</a></p>
    </main>

</html>
